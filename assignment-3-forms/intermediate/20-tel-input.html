<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q20 - Tel Input</title>
</head>
<body>
<!--
  Question 20 (intermediate): Build a form using tel input type for phone number formatting.
-->
<form action="#" method="post">
  <label for="tel">Phone Number:</label>
  <input type="tel" id="tel" name="phone" placeholder="123-456-7890"
         pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Format: 123-456-7890">
  <input type="submit" value="Submit">
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q12 - Placeholder Attribute</title>
</head>
<body>
<!--
  Question 12 (intermediate): Add a placeholder attribute in inputs for guiding user entries.
-->
<form action="#" method="post">
  <input type="text" name="name" placeholder="Enter your full name"><br><br>
  <input type="email" name="email" placeholder="example@mail.com"><br><br>
  <input type="tel" name="phone" placeholder="10-digit mobile number">
</form>
</body>
</html>

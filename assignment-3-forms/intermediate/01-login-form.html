<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q1 - Login Form</title>
</head>
<body>
<!--
  Question 1 (intermediate): Create a login form with username and password fields, and a submit button.
-->
<form action="#" method="post">
  <label for="user">Username:</label>
  <input type="text" id="user" name="username" required><br><br>
  <label for="pass">Password:</label>
  <input type="password" id="pass" name="password" required><br><br>
  <input type="submit" value="Login">
</form>
</body>
</html>

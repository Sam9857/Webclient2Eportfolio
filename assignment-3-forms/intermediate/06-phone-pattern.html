<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q6 - Phone Pattern</title>
</head>
<body>
<!--
  Question 6 (intermediate): Build a form that has pattern validation for a 10-digit phone number.
-->
<form action="#" method="post">
  <label for="phone">Phone (10 digits):</label>
  <input type="text" id="phone" name="phone" pattern="[0-9]{10}"
         title="Enter exactly 10 digits" required>
  <input type="submit" value="Submit">
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q18 - Rating Range 1 10</title>
</head>
<body>
<!--
  Question 18 (intermediate): Add a form where the range input shows values from 1 to 10 for rating experience.
-->
<form action="#" method="post">
  <label for="rate">Rate your experience (1&ndash;10):</label><br>
  <input type="range" id="rate" name="rating" min="1" max="10" value="5"
         oninput="val.textContent = this.value">
  <span id="val">5</span>
</form>
</body>
</html>

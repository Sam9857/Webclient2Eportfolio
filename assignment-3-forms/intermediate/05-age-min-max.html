<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q5 - Age Min Max</title>
</head>
<body>
<!--
  Question 5 (intermediate): Create a form where the age input is restricted between 18-60 using min and max attributes.
-->
<form action="#" method="post">
  <label for="age">Age (18&ndash;60):</label>
  <input type="number" id="age" name="age" min="18" max="60" required>
  <input type="submit" value="Submit">
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q7 - Pdf Upload</title>
</head>
<body>
<!--
  Question 7 (intermediate): Create a file upload form where only PDF files are allowed using the accept attribute.
-->
<form action="#" method="post" enctype="multipart/form-data">
  <label for="doc">Upload PDF:</label>
  <input type="file" id="doc" name="document" accept=".pdf,application/pdf">
  <input type="submit" value="Upload">
</form>
</body>
</html>

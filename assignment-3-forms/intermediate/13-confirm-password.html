<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q13 - Confirm Password</title>
</head>
<body>
<!--
  Question 13 (intermediate): Create a form using password input with a “Confirm Password” field.
-->
<form action="#" method="post" onsubmit="return checkMatch()">
  <label for="p1">Password:</label>
  <input type="password" id="p1" name="password" required><br><br>
  <label for="p2">Confirm Password:</label>
  <input type="password" id="p2" name="confirm" required><br><br>
  <input type="submit" value="Submit">
</form>
<script>
  function checkMatch() {
    if (document.getElementById("p1").value !== document.getElementById("p2").value) {
      alert("Passwords do not match!");
      return false;
    }
    return true;
  }
</script>
</body>
</html>

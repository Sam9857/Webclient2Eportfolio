<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q17 - Hidden Input</title>
</head>
<body>
<!--
  Question 17 (intermediate): Create a form with hidden input fields (like a user ID).
-->
<form action="#" method="post">
  <input type="hidden" name="userId" value="10245">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name"><br><br>
  <input type="submit" value="Submit">
</form>
<p><em>The hidden field "userId" is sent with the form but is not visible. Inspect the page to see it.</em></p>
</body>
</html>

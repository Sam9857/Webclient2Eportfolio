<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q11 - Email Format</title>
</head>
<body>
<!--
  Question 11 (intermediate): Create a form where email input must follow correct format (e.g., abc@mail.com).
-->
<form action="#" method="post">
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" placeholder="abc@mail.com"
         pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}" required>
  <input type="submit" value="Submit">
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q14 - Reset Test</title>
</head>
<body>
<!--
  Question 14 (intermediate): Make a form with a reset button and test clearing inputs.
-->
<form action="#" method="post">
  <label for="a">Name:</label>
  <input type="text" id="a" name="name" value="Default Name"><br><br>
  <label for="b">Message:</label><br>
  <textarea id="b" name="msg" rows="3" cols="30"></textarea><br><br>
  <input type="checkbox" id="c" name="agree"><label for="c">Agree</label><br><br>
  <input type="reset" value="Reset Form">
</form>
<p><em>Test: type something, tick the box, then click Reset &mdash; fields return to their initial values.</em></p>
</body>
</html>

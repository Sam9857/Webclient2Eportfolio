<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q3 - Payment Method</title>
</head>
<body>
<!--
  Question 3 (intermediate): Add radio buttons for “Payment Method” (Credit Card, UPI, Cash on Delivery).
-->
<form action="#" method="post">
  <p>Payment Method:</p>
  <input type="radio" id="cc" name="payment" value="credit-card" required>
  <label for="cc">Credit Card</label><br>
  <input type="radio" id="upi" name="payment" value="upi">
  <label for="upi">UPI</label><br>
  <input type="radio" id="cod" name="payment" value="cod">
  <label for="cod">Cash on Delivery</label><br><br>
  <input type="submit" value="Pay">
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q10 - Address Fieldset</title>
</head>
<body>
<!--
  Question 10 (intermediate): Build a form using <fieldset> and <legend> for grouping address details.
-->
<form action="#" method="post">
  <fieldset>
    <legend>Address Details</legend>
    <label for="street">Street:</label>
    <input type="text" id="street" name="street"><br><br>
    <label for="city">City:</label>
    <input type="text" id="city" name="city"><br><br>
    <label for="state">State:</label>
    <input type="text" id="state" name="state"><br><br>
    <label for="zip">PIN Code:</label>
    <input type="text" id="zip" name="pin" pattern="[0-9]{6}" title="6-digit PIN code">
  </fieldset>
</form>
</body>
</html>

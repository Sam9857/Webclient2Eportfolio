<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q4 - Languages Checkbox</title>
</head>
<body>
<!--
  Question 4 (intermediate): Use checkboxes for selecting multiple languages (English, Hindi, French, Spanish).
-->
<form action="#" method="post">
  <p>Languages you speak:</p>
  <input type="checkbox" id="en" name="lang" value="english"><label for="en">English</label><br>
  <input type="checkbox" id="hi" name="lang" value="hindi"><label for="hi">Hindi</label><br>
  <input type="checkbox" id="fr" name="lang" value="french"><label for="fr">French</label><br>
  <input type="checkbox" id="es" name="lang" value="spanish"><label for="es">Spanish</label><br><br>
  <input type="submit" value="Submit">
</form>
</body>
</html>

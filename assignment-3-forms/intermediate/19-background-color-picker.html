<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q19 - Background Color Picker</title>
</head>
<body>
<!--
  Question 19 (intermediate): Design a colour picker form allowing users to set background colour.
-->
<form action="#" onsubmit="return false">
  <label for="bg">Choose background colour:</label>
  <input type="color" id="bg" value="#ffffff">
</form>
<script>
  document.getElementById("bg").addEventListener("input", e => {
    document.body.style.backgroundColor = e.target.value;
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Q2 - Password Pattern</title>
</head>
<body>
<!--
  Question 2 (advanced): Make a form where passwords must meet a pattern (8+ characters, at least 1 capital, 1 number).
-->
<form action="#" method="post">
  <label for="pw">Password:</label>
  <input type="password" id="pw" name="password"
         pattern="(?=.*\d)(?=.*[A-Z]).{8,}"
         title="Minimum 8 characters, at least 1 capital letter and 1 number" required>
  <input type="submit" value="Submit">
</form>
<p><small>Rules: 8+ characters, at least one uppercase letter, at least one digit. Example: <code>Hello1234</code></small></p>
</body>
</html>

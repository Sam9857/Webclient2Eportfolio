<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Q7 - Aria Accessible Form</title>
</head>
<body>
<!--
  Question 7 (advanced): Add ARIA labels and roles for accessibility in a form with multiple input types.
-->
<form action="#" method="post" role="form" aria-labelledby="formTitle">
  <h2 id="formTitle">Accessible Sign-up Form</h2>

  <label for="name">Full Name</label>
  <input type="text" id="name" name="name" aria-required="true" aria-describedby="nameHelp">
  <small id="nameHelp">Enter your first and last name.</small><br><br>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" aria-required="true"><br><br>

  <div role="radiogroup" aria-labelledby="genderLabel">
    <span id="genderLabel">Gender</span><br>
    <input type="radio" id="m" name="gender" value="m"><label for="m">Male</label>
    <input type="radio" id="f" name="gender" value="f"><label for="f">Female</label>
  </div><br>

  <div role="group" aria-labelledby="intLabel">
    <span id="intLabel">Interests</span><br>
    <input type="checkbox" id="i1" name="int" value="music"><label for="i1">Music</label>
    <input type="checkbox" id="i2" name="int" value="sports"><label for="i2">Sports</label>
  </div><br>

  <label for="country">Country</label>
  <select id="country" name="country" aria-label="Select your country">
    <option>India</option><option>USA</option><option>UK</option>
  </select><br><br>

  <label for="bio">Short Bio</label><br>
  <textarea id="bio" name="bio" rows="3" cols="30" aria-label="Short biography"></textarea><br><br>

  <button type="submit" aria-label="Submit the sign-up form">Submit</button>
</form>
</body>
</html>

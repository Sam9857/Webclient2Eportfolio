<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Q9 - Profile Settings</title>
</head>
<body>
<!--
  Question 9 (advanced): Build a profile settings form with Name, Profile Picture Upload, Colour Theme Picker, and Save button.
-->
<h2>Profile Settings</h2>
<form id="profile" action="#" method="post" enctype="multipart/form-data">
  <label for="name">Name:</label><br>
  <input type="text" id="name" name="name" required><br><br>

  <label for="pic">Profile Picture:</label><br>
  <input type="file" id="pic" name="picture" accept="image/*"><br>
  <img id="preview" alt="" style="display:none;width:100px;height:100px;border-radius:50%;margin-top:8px;object-fit:cover"><br><br>

  <label for="theme">Colour Theme:</label>
  <input type="color" id="theme" name="theme" value="#4a90d9"><br><br>

  <button type="submit">Save</button>
</form>
<script>
  document.getElementById("pic").addEventListener("change", e => {
    const file = e.target.files[0];
    const img = document.getElementById("preview");
    if (file) { img.src = URL.createObjectURL(file); img.style.display = "inline-block"; }
  });
  document.getElementById("theme").addEventListener("input", e => {
    document.querySelector("h2").style.color = e.target.value;
  });
</script>
</body>
</html>

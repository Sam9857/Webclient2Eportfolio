<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Q5 - Job Application</title>
</head>
<body>
<!--
  Question 5 (advanced): Create a job application form with File Upload restricted to only PDFs or DOCs.
-->
<h2>Job Application</h2>
<form action="#" method="post" enctype="multipart/form-data">
  <label for="name">Full Name:</label><br>
  <input type="text" id="name" name="name" required><br><br>
  <label for="email">Email:</label><br>
  <input type="email" id="email" name="email" required><br><br>
  <label for="pos">Position:</label>
  <select id="pos" name="position" required>
    <option value="">-- Select --</option>
    <option>Frontend Developer</option>
    <option>Backend Developer</option>
    <option>Designer</option>
  </select><br><br>
  <label for="resume">Upload Resume (PDF or DOC/DOCX):</label><br>
  <input type="file" id="resume" name="resume"
         accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
         required><br><br>
  <input type="submit" value="Apply">
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Q13 - Required Name</title>
</head>
<body>
<!--
  Question 13 (basic): Add a required attribute in a text input field for entering a name.
-->
<form action="#" method="post">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required>
  <input type="submit" value="Submit">
</form>
</body>
</html>

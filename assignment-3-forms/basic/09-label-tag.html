<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Q9 - Label Tag</title>
</head>
<body>
<!--
  Question 9 (basic): Use the <label> tag to correctly label a text input field.
-->
<form action="#" method="post">
  <!-- "for" must match the input's "id" -->
  <label for="email-name">Your Name:</label>
  <input type="text" id="email-name" name="name">
</form>
</body>
</html>

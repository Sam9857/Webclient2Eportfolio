<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Q14 - Email Validation</title>
</head>
<body>
<!--
  Question 14 (basic): Build a form with type=”email” input and test validation.
-->
<form action="#" method="post">
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>
  <input type="submit" value="Submit">
</form>
<p><em>Test: enter "abc" and submit &mdash; the browser rejects it. Enter "abc@mail.com" &mdash; it passes.</em></p>
</body>
</html>

<body>
<!--
  Question 11 (basic): Build a form that includes a textarea for user comments.
-->
<form action="#" method="post">
  <label for="comments">Comments:</label><br>
  <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
</form>
</body>

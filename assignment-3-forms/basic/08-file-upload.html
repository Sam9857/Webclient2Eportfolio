<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Q8 - File Upload</title>
</head>
<body>
<!--
  Question 8 (basic): Add a form with a file upload input to let users upload a profile picture.
-->
<form action="#" method="post" enctype="multipart/form-data">
  <label for="pic">Upload Profile Picture:</label>
  <input type="file" id="pic" name="profilePic" accept="image/*">
</form>
</body>
</html>

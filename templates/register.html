{% extends "auth_base.html" %}
{% block title %}Register{% endblock %}
{% block head_title %}Create account{% endblock %}
{% block head_sub %}Join Skill Check in a few seconds{% endblock %}

{% block form %}
<form method="post" action="{{ url_for('register') }}">
  <div class="field">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" placeholder="Your name" value="{{ form.name }}" required autofocus>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" value="{{ form.email }}" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="At least 6 characters" minlength="6" required>
  </div>
  <div class="field">
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" placeholder="Type the password again" required>
  </div>
  <button type="submit" class="btn btn-full">Create account</button>
</form>
<p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
{% endblock %}

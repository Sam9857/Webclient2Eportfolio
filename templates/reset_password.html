{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block head_title %}Set new password{% endblock %}
{% block head_sub %}Choose a password you will remember{% endblock %}

{% block form %}
<form method="post" action="{{ url_for('reset_password', token=token) }}">
  <div class="field">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" placeholder="At least 6 characters" minlength="6" required autofocus>
  </div>
  <div class="field">
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" placeholder="Type the password again" required>
  </div>
  <button type="submit" class="btn btn-full btn-green">Update password</button>
</form>
<p class="auth-footer"><a href="{{ url_for('login') }}">&larr; Back to login</a></p>
{% endblock %}

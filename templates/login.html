{% extends "auth_base.html" %}
{% block title %}Login{% endblock %}
{% block head_title %}Welcome back{% endblock %}
{% block head_sub %}Login to continue your preparation{% endblock %}

{% block form %}
<form method="post" action="{{ url_for('login') }}">
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" value="{{ email }}" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Enter your password" required>
  </div>
  <p class="forgot-link"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
  <button type="submit" class="btn btn-full">Login</button>
</form>
<p class="auth-footer">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Q5 - Svg Sunset Scene</title>
</head>
<body>
<!--
  Question 5 (advanced): Draw a sunset scene in SVG (sun = circle, ground = rectangle, rays = lines).
-->
<svg width="500" height="300" viewBox="0 0 500 300">
  <!-- Sky -->
  <rect width="500" height="300" fill="#ff9966" />
  <!-- Sun -->
  <circle cx="250" cy="200" r="60" fill="#ffd700" />
  <!-- Rays -->
  <g stroke="#ffd700" stroke-width="4" stroke-linecap="round">
    <line x1="250" y1="110" x2="250" y2="70" />
    <line x1="190" y1="130" x2="165" y2="100" />
    <line x1="310" y1="130" x2="335" y2="100" />
    <line x1="160" y1="175" x2="120" y2="160" />
    <line x1="340" y1="175" x2="380" y2="160" />
  </g>
  <!-- Ground (drawn after the sun so it covers its lower half) -->
  <rect x="0" y="200" width="500" height="100" fill="#2d6a4f" />
</svg>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Q10 - Dashboard Animated Canvas</title>
  <style>
    body { margin: 0; }
    header, footer { background: #2c3e50; color: #fff; padding: 12px 20px; }
    header nav ul { list-style: none; display: flex; gap: 20px; padding: 0; margin: 8px 0 0; }
    header nav a { color: #fff; text-decoration: none; }
    .container { display: flex; gap: 20px; padding: 20px; }
    main { flex: 3; }
    aside { flex: 1; background: #f1f3f5; padding: 12px; border-radius: 6px; }
    article { border-bottom: 1px solid #ddd; margin-bottom: 16px; padding-bottom: 8px; }
    footer { text-align: center; }
  </style>
  <style>nav { background:#34495e; padding:8px 20px; } nav ul { list-style:none; display:flex; gap:20px; margin:0; padding:0; } nav a { color:#fff; text-decoration:none; }</style>
</head>
<body>
<!--
  Question 10 (advanced): Create a dashboard page with <header>, <nav>, <main>, <aside>, <footer>, plus an animated <canvas> graph.
-->
<header><h1>Analytics Dashboard</h1></header>
<nav>
  <ul>
    <li><a href="#">Overview</a></li>
    <li><a href="#">Reports</a></li>
    <li><a href="#">Settings</a></li>
  </ul>
</nav>
<div class="container">
  <main>
    <h2>Live Traffic</h2>
    <canvas id="graph" width="560" height="260" style="border:1px solid #ccc;background:#fff"></canvas>
  </main>
  <aside>
    <h3>Stats</h3>
    <p>Visitors: <strong id="visitors">0</strong></p>
    <p>Status: Online</p>
  </aside>
</div>
<footer><p>&copy; 2025 Dashboard Inc.</p></footer>
<script>
  const canvas = document.getElementById("graph");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const data = Array.from({ length: 30 }, () => 100 + Math.random() * 100);

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = "#eee";
    for (let i = 1; i < 5; i++) {
      ctx.beginPath(); ctx.moveTo(0, i * H / 5); ctx.lineTo(W, i * H / 5); ctx.stroke();
    }

    // line graph
    ctx.beginPath();
    data.forEach((v, i) => {
      const x = i * (W / (data.length - 1));
      i === 0 ? ctx.moveTo(x, H - v) : ctx.lineTo(x, H - v);
    });
    ctx.strokeStyle = "#3498db";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // every 500 ms: drop the oldest point, add a new random one
  setInterval(() => {
    data.shift();
    const next = Math.max(30, Math.min(230, data[data.length - 1] + (Math.random() - 0.5) * 60));
    data.push(next);
    document.getElementById("visitors").textContent = Math.round(next * 10);
    draw();
  }, 500);
  draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Q9 - Semantic Page Svg Bar Chart</title>
  <style>
    body { margin: 0; }
    header, footer { background: #2c3e50; color: #fff; padding: 12px 20px; }
    header nav ul { list-style: none; display: flex; gap: 20px; padding: 0; margin: 8px 0 0; }
    header nav a { color: #fff; text-decoration: none; }
    .container { display: flex; gap: 20px; padding: 20px; }
    main { flex: 3; }
    aside { flex: 1; background: #f1f3f5; padding: 12px; border-radius: 6px; }
    article { border-bottom: 1px solid #ddd; margin-bottom: 16px; padding-bottom: 8px; }
    footer { text-align: center; }
  </style>
</head>
<body>
<!--
  Question 9 (advanced): Build a webpage that has a semantic structure and an inline SVG chart (e.g., bar chart using <rect>).
-->
<header><h1>Sales Report</h1></header>
<main style="padding:20px">
  <article>
    <h2>Quarterly Sales (in lakhs)</h2>
    <figure>
      <svg width="400" height="250" role="img" aria-label="Bar chart of quarterly sales">
        <!-- axes -->
        <line x1="40" y1="10" x2="40" y2="200" stroke="#333" />
        <line x1="40" y1="200" x2="390" y2="200" stroke="#333" />
        <!-- bars: height = value * 2 -->
        <rect x="70"  y="120" width="50" height="80"  fill="#3498db" />
        <rect x="140" y="80"  width="50" height="120" fill="#2ecc71" />
        <rect x="210" y="50"  width="50" height="150" fill="#f1c40f" />
        <rect x="280" y="100" width="50" height="100" fill="#e74c3c" />
        <!-- labels -->
        <text x="95"  y="220" text-anchor="middle" font-size="12">Q1</text>
        <text x="165" y="220" text-anchor="middle" font-size="12">Q2</text>
        <text x="235" y="220" text-anchor="middle" font-size="12">Q3</text>
        <text x="305" y="220" text-anchor="middle" font-size="12">Q4</text>
        <text x="95"  y="112" text-anchor="middle" font-size="12">40</text>
        <text x="165" y="72"  text-anchor="middle" font-size="12">60</text>
        <text x="235" y="42"  text-anchor="middle" font-size="12">75</text>
        <text x="305" y="92"  text-anchor="middle" font-size="12">50</text>
      </svg>
      <figcaption>Figure 1: Sales by quarter</figcaption>
    </figure>
  </article>
</main>
<footer><p>&copy; 2025 Sales Dept.</p></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Q3 - Photo Gallery Figures</title>
  <style>
    .gallery { display: flex; flex-wrap: wrap; gap: 16px; }
    .gallery figure { margin: 0; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.2); padding: 8px; }
    .gallery img { display: block; width: 200px; }
    .gallery figcaption { margin-top: 6px; font-size: 14px; }
  </style>
</head>
<body>
<!--
  Question 3 (advanced): Combine <figure> with image thumbnails, each having captions (like a mini photo gallery).
-->
<h1>Mini Photo Gallery</h1>
<div class="gallery">
  <figure><img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150'%3E%3Crect width='100%' height='100%' fill='%23e74c3c'/%3E%3Ctext x='50%' y='50%' fill='white' font-size='20' font-family='Arial' text-anchor='middle' dominant-baseline='middle'%3EPhoto 1%3C/text%3E%3C/svg%3E" alt="Photo 1"><figcaption>Red Canyon</figcaption></figure>
  <figure><img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150'%3E%3Crect width='100%' height='100%' fill='%233498db'/%3E%3Ctext x='50%' y='50%' fill='white' font-size='20' font-family='Arial' text-anchor='middle' dominant-baseline='middle'%3EPhoto 2%3C/text%3E%3C/svg%3E" alt="Photo 2"><figcaption>Blue Lagoon</figcaption></figure>
  <figure><img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150'%3E%3Crect width='100%' height='100%' fill='%232ecc71'/%3E%3Ctext x='50%' y='50%' fill='white' font-size='20' font-family='Arial' text-anchor='middle' dominant-baseline='middle'%3EPhoto 3%3C/text%3E%3C/svg%3E" alt="Photo 3"><figcaption>Green Valley</figcaption></figure>
  <figure><img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150'%3E%3Crect width='100%' height='100%' fill='%23f39c12'/%3E%3Ctext x='50%' y='50%' fill='white' font-size='20' font-family='Arial' text-anchor='middle' dominant-baseline='middle'%3EPhoto 4%3C/text%3E%3C/svg%3E" alt="Photo 4"><figcaption>Golden Desert</figcaption></figure>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Q12 - Article Publication Date</title>
</head>
<body>
<!--
  Question 12 (basic): Display the publication date of an article using <time>.
-->
<article>
  <h2>Getting Started with HTML5</h2>
  <p>Published on <time datetime="2025-08-20">20 August 2025</time></p>
  <p>HTML5 is the latest version of the HTML standard.</p>
</article>
</body>
</html>

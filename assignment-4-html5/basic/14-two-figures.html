<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Q14 - Two Figures</title>
</head>
<body>
<!--
  Question 14 (basic): Write HTML to show two images with their captions using <figure> and <figcaption>.
-->
<figure>
  <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='200'%3E%3Crect width='100%' height='100%' fill='%23e67e22'/%3E%3Ctext x='50%' y='50%' fill='white' font-size='20' font-family='Arial' text-anchor='middle' dominant-baseline='middle'%3EImage One%3C/text%3E%3C/svg%3E" alt="First image">
  <figcaption>Caption for the first image.</figcaption>
</figure>
<figure>
  <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='200'%3E%3Crect width='100%' height='100%' fill='%2327ae60'/%3E%3Ctext x='50%' y='50%' fill='white' font-size='20' font-family='Arial' text-anchor='middle' dominant-baseline='middle'%3EImage Two%3C/text%3E%3C/svg%3E" alt="Second image">
  <figcaption>Caption for the second image.</figcaption>
</figure>
</body>
</html>

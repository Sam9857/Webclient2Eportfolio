<!DOCTYPE html>

  <title>Basic Q13 - Simple Blog Page</title>

<body>
<!--
  Question 13 (basic): Create a simple blog page with one <article> inside <main>.
-->
<header><h1>My Blog</h1></header>
<main>
  <article>
    <h2>My First Post</h2>
    <p>Hello world! This is my very first blog post.</p>
  </article>
</main>
<footer><p>&copy; 2025 My Blog</p></footer>
</body>

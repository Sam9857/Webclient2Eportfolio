<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Q11 - Nav Horizontal</title>
  <style>
    nav ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 20px; }
    nav a { text-decoration: none; color: #0366d6; }
  </style>
</head>
<body>
<!--
  Question 11 (basic): Add a <nav> with links that display horizontally.
-->
<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>
</body>
</html>

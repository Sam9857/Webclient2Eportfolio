<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q16 - Canvas Diagonal Line</title>
</head>
<body>
<!--
  Question 16 (intermediate): Draw a diagonal line on a canvas from top-left to bottom-right.
-->
<canvas id="c" width="300" height="200" style="border:1px solid #000"></canvas>
<script>
  const c = document.getElementById("c");
  const ctx = c.getContext("2d");
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(c.width, c.height);
  ctx.lineWidth = 3;
  ctx.strokeStyle = "black";
  ctx.stroke();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q5 - Two Articles In Main</title>
</head>
<body>
<!--
  Question 5 (intermediate): Use <article> tags to add two different blog posts inside <main>.
-->
<main>
  <article>
    <h2>Post 1: Learning HTML</h2>
    <p>HTML is the foundation of every website.</p>
  </article>
  <article>
    <h2>Post 2: Learning CSS</h2>
    <p>CSS brings colour and layout to your HTML.</p>
  </article>
</main>
</body>
</html>

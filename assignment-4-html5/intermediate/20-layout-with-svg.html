<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q20 - Layout With Svg</title>
  <style>
    body { margin: 0; }
    header, footer { background: #2c3e50; color: #fff; padding: 12px 20px; }
    header nav ul { list-style: none; display: flex; gap: 20px; padding: 0; margin: 8px 0 0; }
    header nav a { color: #fff; text-decoration: none; }
    .container { display: flex; gap: 20px; padding: 20px; }
    main { flex: 3; }
    aside { flex: 1; background: #f1f3f5; padding: 12px; border-radius: 6px; }
    article { border-bottom: 1px solid #ddd; margin-bottom: 16px; padding-bottom: 8px; }
    footer { text-align: center; }
  </style>
</head>
<body>
<!--
  Question 20 (intermediate): Write HTML with a <header>, <main>, <aside>, and <footer> plus an inline SVG below the main content.
-->
<header><h1>My Website</h1></header>
<div class="container">
  <main>
    <h2>Main Content</h2>
    <p>This is the main content area.</p>
    <svg width="300" height="120">
      <rect x="10" y="10" width="280" height="100" fill="#3498db" />
      <circle cx="150" cy="60" r="35" fill="#f1c40f" />
    </svg>
  </main>
  <aside><h3>Sidebar</h3><p>Related links.</p></aside>
</div>
<footer><p>&copy; 2025 My Website</p></footer>
</body>
</html>

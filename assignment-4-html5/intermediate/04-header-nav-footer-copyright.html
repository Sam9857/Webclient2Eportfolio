<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q4 - Header Nav Footer Copyright</title>
  <style>
    body { margin: 0; }
    header, footer { background: #2c3e50; color: #fff; padding: 12px 20px; }
    header nav ul { list-style: none; display: flex; gap: 20px; padding: 0; margin: 8px 0 0; }
    header nav a { color: #fff; text-decoration: none; }
    .container { display: flex; gap: 20px; padding: 20px; }
    main { flex: 3; }
    aside { flex: 1; background: #f1f3f5; padding: 12px; border-radius: 6px; }
    article { border-bottom: 1px solid #ddd; margin-bottom: 16px; padding-bottom: 8px; }
    footer { text-align: center; }
  </style>
</head>
<body>
<!--
  Question 4 (intermediate): Create a page that uses <header> for navigation and <footer> for copyright.
-->
<header>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</header>
<p style="padding:20px">Page content goes here.</p>
<footer>
  <p>&copy; 2025 My Company. All rights reserved.</p>
</footer>
</body>
</html>

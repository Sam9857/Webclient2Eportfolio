<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q2 - Multiple Sections Categories</title>
</head>
<body>
<!--
  Question 2 (intermediate): Write HTML with multiple <section> elements under <main> to display different categories.
-->
<main>
  <section>
    <h2>Technology</h2>
    <p>Latest news about gadgets, software and AI.</p>
  </section>
  <section>
    <h2>Sports</h2>
    <p>Scores, highlights and match reports.</p>
  </section>
  <section>
    <h2>Entertainment</h2>
    <p>Movies, music and celebrity updates.</p>
  </section>
</main>
</body>
</html>

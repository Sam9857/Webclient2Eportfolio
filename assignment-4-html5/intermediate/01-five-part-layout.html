<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q1 - Five Part Layout</title>
  <style>
    body { margin: 0; }
    header, footer { background: #2c3e50; color: #fff; padding: 12px 20px; }
    nav ul { list-style: none; display: flex; gap: 20px; padding: 0; margin: 8px 0 0; }
    nav a { color: #fff; text-decoration: none; }
    .container { display: flex; gap: 20px; padding: 20px; }
    main { flex: 3; }
    aside { flex: 1; background: #f1f3f5; padding: 12px; border-radius: 6px; }
    article { border-bottom: 1px solid #ddd; margin-bottom: 16px; padding-bottom: 8px; }
    footer { text-align: center; }
  </style>
  <style>nav { background:#34495e; padding:8px 20px; } nav a { color:#fff; }</style>
</head>
<body>
<!--
  Question 1 (intermediate): Create a webpage layout with <header>, <nav>, <main>, <aside>, and <footer>.
-->
<header><h1>My Website</h1></header>
<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>
<div class="container">
  <main>
    <h2>Main Content</h2>
    <p>This is the primary content of the page.</p>
  </main>
  <aside>
    <h3>Sidebar</h3>
    <p>Extra information goes here.</p>
  </aside>
</div>
<footer><p>&copy; 2025 My Website</p></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q10 - Magazine Layout</title>
  <style>
    section { border-top: 3px solid #2c3e50; margin: 16px 0; }
    section article { display: inline-block; width: 45%; vertical-align: top; margin-right: 2%; }
  </style>
</head>
<body>
<!--
  Question 10 (intermediate): Write HTML to structure a magazine-like layout using <section> and <article>.
-->
<header><h1>The Weekly Magazine</h1></header>
<main>
  <section>
    <h2>Lifestyle</h2>
    <article><h3>Minimalist Living</h3><p>How living with less can improve your life.</p></article>
    <article><h3>Healthy Recipes</h3><p>Quick meals for busy weekdays.</p></article>
  </section>
  <section>
    <h2>Technology</h2>
    <article><h3>AI in 2025</h3><p>What to expect from artificial intelligence.</p></article>
    <article><h3>Gadget Reviews</h3><p>The best phones of the year.</p></article>
  </section>
</main>
</body>
</html>

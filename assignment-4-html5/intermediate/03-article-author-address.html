<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q3 - Article Author Address</title>
</head>
<body>
<!--
  Question 3 (intermediate): Build a blog post with <article> and show its author info in <address>.
-->
<article>
  <h2>Understanding Semantic HTML</h2>
  <p>Semantic elements describe the meaning of the content they wrap, helping browsers, search engines and screen readers.</p>
  <address>
    Author: <a href="mailto:author@example.com">Jane Doe</a><br>
    Mumbai, India
  </address>
</article>
</body>
</html>

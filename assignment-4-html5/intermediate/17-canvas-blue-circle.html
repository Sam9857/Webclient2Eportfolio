<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Q17 - Canvas Blue Circle</title>
</head>
<body>
<!--
  Question 17 (intermediate): Use <canvas> to draw a filled blue circle.
-->
<canvas id="c" width="300" height="200" style="border:1px solid #000"></canvas>
<script>
  const ctx = document.getElementById("c").getContext("2d");
  ctx.beginPath();
  ctx.arc(150, 100, 70, 0, 2 * Math.PI);
  ctx.fillStyle = "blue";
  ctx.fill();
</script>
</body>
</html>

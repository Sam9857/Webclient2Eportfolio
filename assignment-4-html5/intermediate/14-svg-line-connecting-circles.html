<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Intermediate Q14 - Svg Line Connecting Circles</title>
</head>
<body>
<!--
  Question 14 (intermediate): Create an inline SVG with a line connecting two circles.
-->
<svg width="400" height="150">
  <line x1="60" y1="75" x2="340" y2="75" stroke="black" stroke-width="3" />
  <circle cx="60" cy="75" r="30" fill="tomato" />
  <circle cx="340" cy="75" r="30" fill="dodgerblue" />
</svg>
</body>

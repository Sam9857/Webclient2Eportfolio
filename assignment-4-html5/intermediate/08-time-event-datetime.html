<body>
<!--
  Question 8 (intermediate): Use <time> to mark the date and time of an event (like “Published on 20 August 2025, 5:00 PM”).
-->
<p>Published on <time datetime="2025-08-20T17:00">20 August 2025, 5:00 PM</time></p>
</body>

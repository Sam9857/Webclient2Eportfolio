<body>
<!--
  Question 7 (intermediate): Display one image with a title using <figure> and <figcaption> inside <section>.
-->
<section>
  <h2>Gallery</h2>
  <figure>
    <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='250'%3E%3Crect width='100%' height='100%' fill='%238e44ad'/%3E%3Ctext x='50%' y='50%' fill='white' font-size='20' font-family='Arial' text-anchor='middle' dominant-baseline='middle'%3ESunset%3C/text%3E%3C/svg%3E" alt="Sunset" width="400">
    <figcaption>Sunset at the beach</figcaption>
  </figure>
</section>
</body>
</html>
